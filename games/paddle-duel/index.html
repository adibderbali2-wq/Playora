<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Paddle Duel - PLAYORA</title>
<meta name="robots" content="noindex">
<style>
  html, body { margin: 0; height: 100%; background: #07060f; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c" aria-label="Paddle Duel game"></canvas>
<script>
/* Paddle Duel - an original PLAYORA game for 1 or 2 players. */
(() => {
  const W = 960, H = 540, WIN = 7;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let scale = 1, ox = 0, oy = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    scale = Math.min(innerWidth / W, innerHeight / H);
    ox = (innerWidth - W * scale) / 2; oy = (innerHeight - H * scale) / 2;
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
  }
  addEventListener('resize', resize); resize();

  const P = (x, color) => ({ x, y: H / 2, h: 96, w: 14, score: 0, color, target: null });
  let left, right, puck, state = 'title', mode = 1, keys = {}, serveT = 0, trail = [], winner = '';

  function reset() { left = P(36, '#c8ff4d'); right = P(W - 36, '#ff5c8a'); serve(Math.random() < 0.5 ? 1 : -1); }
  function serve(dir) { puck = { x: W / 2, y: H / 2, r: 11, vx: 0, vy: 0, dir }; serveT = 0.9; trail = []; }
  reset();

  function movePaddle(p, up, down, dt) {
    if (p.target !== null) p.y += (p.target - p.y) * Math.min(1, dt * 16);
    else p.y += ((down ? 1 : 0) - (up ? 1 : 0)) * 560 * dt;
    p.y = Math.max(p.h / 2 + 10, Math.min(H - p.h / 2 - 10, p.y));
  }

  function update(dt) {
    if (state !== 'play') return;
    movePaddle(left, keys.KeyW, keys.KeyS, dt);
    if (mode === 2) movePaddle(right, keys.ArrowUp, keys.ArrowDown, dt);
    else { // computer: follows the puck with a reaction limit
      const aim = puck.vx > 0 ? puck.y : H / 2;
      const diff = aim - right.y;
      right.y += Math.sign(diff) * Math.min(Math.abs(diff), 380 * dt);
      right.y = Math.max(right.h / 2 + 10, Math.min(H - right.h / 2 - 10, right.y));
    }

    if (serveT > 0) { serveT -= dt; if (serveT <= 0) { const a = (Math.random() - 0.5) * 0.8; puck.vx = Math.cos(a) * 420 * puck.dir; puck.vy = Math.sin(a) * 420; } return; }
    trail.push({ x: puck.x, y: puck.y }); if (trail.length > 12) trail.shift();
    puck.x += puck.vx * dt; puck.y += puck.vy * dt;
    if (puck.y < puck.r + 10 || puck.y > H - puck.r - 10) { puck.vy = -puck.vy; puck.y = Math.max(puck.r + 10, Math.min(H - puck.r - 10, puck.y)); }

    for (const p of [left, right]) {
      const facing = p === left ? puck.vx < 0 : puck.vx > 0;
      if (facing && Math.abs(puck.x - p.x) < puck.r + p.w / 2 && Math.abs(puck.y - p.y) < p.h / 2 + puck.r) {
        const hit = (puck.y - p.y) / (p.h / 2);
        const sp = Math.min(Math.hypot(puck.vx, puck.vy) * 1.06, 1100);
        const a = hit * 0.9;
        puck.vx = Math.cos(a) * sp * (p === left ? 1 : -1); puck.vy = Math.sin(a) * sp;
        puck.x = p.x + (p === left ? 1 : -1) * (p.w / 2 + puck.r);
      }
    }
    if (puck.x < -20) point(right, 1);
    if (puck.x > W + 20) point(left, -1);
  }
  function point(p, dir) {
    p.score++;
    if (p.score >= WIN) { state = 'over'; winner = p === left ? 'LEFT PLAYER' : mode === 1 ? 'COMPUTER' : 'RIGHT PLAYER'; }
    else serve(dir);
  }

  function text(s, x, y, size, color = '#f4f2ff', align = 'center', weight = 800) { ctx.font = `${weight} ${size}px system-ui, -apple-system, Segoe UI, sans-serif`; ctx.textAlign = align; ctx.fillStyle = color; ctx.fillText(s, x, y); }
  function draw() {
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#07060f'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.restore();
    const bg = ctx.createRadialGradient(W / 2, H / 2, 40, W / 2, H / 2, W / 1.2); bg.addColorStop(0, '#1d1846'); bg.addColorStop(1, '#0e0c1d');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 3; ctx.setLineDash([12, 14]);
    ctx.beginPath(); ctx.moveTo(W / 2, 20); ctx.lineTo(W / 2, H - 20); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(W / 2, H / 2, 70, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.strokeRect(10, 10, W - 20, H - 20);

    text(left.score, W / 2 - 70, 90, 64, 'rgba(200,255,77,.85)');
    text(right.score, W / 2 + 70, 90, 64, 'rgba(255,92,138,.85)');
    text(mode === 1 ? 'YOU vs CPU' : 'PLAYER 1 vs PLAYER 2', W / 2, H - 26, 13, '#8a85b0', 'center', 700);

    trail.forEach((t, i) => { ctx.globalAlpha = i / trail.length * 0.35; ctx.fillStyle = '#3ddcff'; ctx.beginPath(); ctx.arc(t.x, t.y, puck.r * (i / trail.length), 0, Math.PI * 2); ctx.fill(); });
    ctx.globalAlpha = 1;
    for (const p of [left, right]) { ctx.shadowColor = p.color; ctx.shadowBlur = 20; ctx.fillStyle = p.color; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(p.x - p.w / 2, p.y - p.h / 2, p.w, p.h, 7) : ctx.rect(p.x - p.w / 2, p.y - p.h / 2, p.w, p.h); ctx.fill(); }
    ctx.shadowColor = '#3ddcff'; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(puck.x, puck.y, puck.r, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;

    const overlay = (a, b, c) => { ctx.fillStyle = 'rgba(7,6,15,.68)'; ctx.fillRect(0, 0, W, H); text(a, W / 2, H / 2 - 40, 52); text(b, W / 2, H / 2 + 8, 19, '#c8ff4d', 'center', 700); if (c) text(c, W / 2, H / 2 + 44, 15, '#b3aed6', 'center', 600); };
    if (state === 'title') { overlay('PADDLE DUEL', 'Press 1 for you vs computer · 2 for two players', 'Or tap the left half (1 player) or right half (2 players)'); text('Left: W / S · Right: ↑ / ↓ · Touch: drag on your side · First to ' + WIN, W / 2, H / 2 + 80, 14, '#8a85b0', 'center', 600); }
    if (state === 'paused') overlay('PAUSED', 'Press P or tap to continue');
    if (state === 'over') overlay(winner + ' WINS!', left.score + ' – ' + right.score, 'Press 1 or 2, or tap, to play again');
  }

  let last = performance.now();
  (function loop(now) { const dt = Math.min(0.033, (now - last) / 1000); last = now; update(dt); draw(); requestAnimationFrame(loop); })(last);

  function begin(m) { mode = m; reset(); state = 'play'; }
  addEventListener('keydown', (e) => {
    if (['ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
    keys[e.code] = true;
    if (e.code === 'KeyW' || e.code === 'KeyS') left.target = null;
    if (e.code === 'ArrowUp' || e.code === 'ArrowDown') right.target = null;
    if ((state === 'title' || state === 'over') && (e.code === 'Digit1' || e.code === 'Numpad1')) begin(1);
    if ((state === 'title' || state === 'over') && (e.code === 'Digit2' || e.code === 'Numpad2')) begin(2);
    if ((state === 'title' || state === 'over') && (e.code === 'Space' || e.code === 'Enter')) begin(mode);
    if (e.code === 'KeyP') state = state === 'play' ? 'paused' : state === 'paused' ? 'play' : state;
  });
  addEventListener('keyup', (e) => { keys[e.code] = false; });

  const pointers = new Map();
  const toGame = (e) => ({ x: (e.clientX - ox) / scale, y: (e.clientY - oy) / scale });
  cv.addEventListener('pointerdown', (e) => {
    const g = toGame(e);
    if (state === 'title' || state === 'over') { begin(g.x < W / 2 ? 1 : 2); return; }
    if (state === 'paused') { state = 'play'; return; }
    pointers.set(e.pointerId, g.x < W / 2 ? left : right);
    cv.setPointerCapture(e.pointerId);
    const p = pointers.get(e.pointerId); if (p === left || mode === 2) p.target = g.y;
  });
  cv.addEventListener('pointermove', (e) => {
    const g = toGame(e);
    let p = pointers.get(e.pointerId);
    if (!p && e.pointerType === 'mouse' && state === 'play') p = g.x < W / 2 || mode === 1 ? left : right;
    if (p && (p === left || mode === 2)) p.target = g.y;
  });
  const up = (e) => pointers.delete(e.pointerId);
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  addEventListener('blur', () => { if (state === 'play') state = 'paused'; });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'paused'; });
})();
</script>
</body>
</html>
